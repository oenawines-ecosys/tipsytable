<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tipsy Table</title>
<meta name="description" content="Tipsy Table wine dinners in Hong Kong. Every volume's wines, menu and map, newest first.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F3E9D7">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tipsy Table">
<meta property="og:title" content="Tipsy Table">
<meta property="og:description" content="Tipsy Table wine dinners in Hong Kong. Every volume's wines, menu and map, newest first.">
<meta property="og:url" content="https://tipsytablehk.com/">
<meta property="og:image" content="https://tipsytablehk.com/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Tipsy Table">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vollkorn:ital,wght@0,400..700;1,400..600&family=Vollkorn+SC:wght@400;600&family=Young+Serif&display=swap">
<style>
/* Colour, type and motion tokens shared by the journal home, every volume page and the 404.
   Comp A's menu card, one ink on paper, always: the site does not follow the phone's dark mode. */
:root {
  --bg: #F3E9D7;          /* paper */
  --insert: #E8D9C0;      /* the "For the nerds" insert */
  --table: #DCCAAC;       /* what the sheet lies on, wide screens */
  --text: #4C2819;        /* ink */
  --heading: #4C2819;
  --muted: #6F5040;       /* tint */
  --accent: #9F3B26;      /* brick */
  --line: #4C2819;        /* line drawings, coast */
  --rule: rgba(76, 40, 25, 0.3);
  --land: rgba(76, 40, 25, 0.075);
  --halo: #F3E9D7;        /* knock-out behind map labels */
  --shade: rgba(76, 40, 25, 0.22);
  --grain-opacity: 0.5;
  --grain-blend: multiply;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-text: "Vollkorn", Georgia, "Times New Roman", serif;
  --font-sc: "Vollkorn SC", "Vollkorn", Georgia, serif;
  --font-zh: "LXGW WenKai TC", "Kaiti TC", "STKaiti", "BiauKai", "PingFang HK", "Noto Serif TC", serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: var(--font-text); font-size: 19px; line-height: 1.45; text-align: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { display: grid; gap: 10px; justify-items: center; }
p { margin: 0; }
.big { font-family: var(--font-display); font-size: 27px; line-height: 1.15; color: var(--heading); transform: rotate(-2deg); }
a { display: inline-flex; align-items: center; min-height: 44px; font-family: var(--font-sc); letter-spacing: 0.06em; color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.pages { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 20px; margin-top: 10px; padding-top: 6px; border-top: 1px solid var(--rule); }
.pages a { color: var(--muted); }
</style>
</head>
<body>
<main><p class="big">This glass is empty.</p><a id="home" href="/">All the dinners</a><a id="latest" href="/vol-1/" data-slug="vol-1">Latest: Volume I</a><nav class="pages" aria-label="Tipsy Table pages"><a href="/about/" data-path="about/">About Us</a><a href="/images/" data-path="images/">Images</a><a href="/contact/" data-path="contact/">Contact Us</a><a href="/pairing-notes/" data-path="pairing-notes/">Pairing notes</a></nav></main>
<script>(() => {
  const seg = location.pathname.split('/').filter(Boolean)[0];
  const custom = /(^|\.)tipsytablehk\.com$/.test(location.hostname);
  const base = custom || !seg ? '/' : '/' + seg + '/';
  const latest = document.getElementById('latest');
  document.getElementById('home').href = base;
  latest.href = base + latest.dataset.slug + '/';
  document.querySelectorAll('a[data-path]').forEach((a) => { a.href = base + a.dataset.path; });
})();</script>
</body>
</html>
